name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Smoke c-shared
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc
          CGO_ENABLED=1 go build -buildmode=c-shared -o /tmp/libcheckscan.so ./cmd/lib
