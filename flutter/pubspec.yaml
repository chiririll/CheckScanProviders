name: providers_native
description: Flutter FFI bindings to CheckScanProviders (libcheckscan).
version: 0.1.1
publish_to: none
repository: https://github.com/chiririll/CheckScanProviders

environment:
  sdk: ">=3.13.0 <4.0.0"
  flutter: ">=3.47.0"

dependencies:
  ffi: ^2.1.4
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        ffiPlugin: true
